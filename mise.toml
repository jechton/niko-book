[tools]
node = "24"

[settings.node]
# Run `corepack enable` after installing Node so pnpm comes from the
# `packageManager` field in package.json, our single source for the pnpm version.
corepack = true

[tasks.dev]
run = "pnpm dev"

[tasks.build]
run = "pnpm build"

[tasks.check]
run = "pnpm biome check"

[tasks.import-chapter]
description = "Format a downloaded chapter: mise run import-chapter ~/Downloads/'Chapter 6.md' > src/content/book/book-1/chapter-6.md"
run = "scripts/import-chapter.sh"
